#
# Preflight — OpenBao settings (secrets_backend: openbao).
#
# Included by includes/preflight.yaml (every site.yaml run except teardown,
# --only included)
# and by playbooks/tests/preflight_secrets_test.yaml. This is the one place the
# user-facing secrets keys are checked: the openbao and external_secrets roles
# and the erag app_secrets role do not check them again. Runs before any role,
# so role defaults are not loaded yet: each default() below equals the default
# the roles apply (roles/openbao/defaults/main.yaml or a default() in the role).
# openbao_kv_mount and openbao_layers have no role default (only
# configs/defaults/global_config.yaml sets them), so a missing one fails here.

- name: "Preflight - Secrets backend: openbao settings"
  when: (secrets_backend | default('local', true)) == 'openbao'
  vars:
    _pf_external: "{{ (openbao_mode | default('internal')) == 'external' }}"
    _pf_auth_mount: "{{ openbao_auth_mount | default('kubernetes', true) | string }}"
    _pf_kv: "{{ openbao_kv_mount | default('', true) | string }}"
    _pf_cid: "{{ openbao_cluster_id | default('', true) or env_name | default('') }}"
    _pf_layers: "{{ openbao_layers | default([]) }}"
    # Layer names end up in store names (DNS-1123 subdomain), in the namespace
    # label key and in the ESO paths annotation key (name part <= 63).
    _pf_layer_max: "{{ 63 - (external_secrets_paths_annotation_suffix | default('-paths') | length) }}"
    _pf_label: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
    _pf_subdomain: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
  block:
    # The openbao role's teardown and upgrade run the same file (one rule).
    - name: "Preflight - Secrets backend: openbao_mode"
      ansible.builtin.include_tasks: ../../roles/openbao/tasks/assert_mode.yaml

    # One or more path segments ("kubernetes", "k8s/cluster-a"); it ends up in
    # login URLs and in the route allowlist.
    - name: "Preflight - Secrets backend: openbao_auth_mount"
      ansible.builtin.assert:
        that:
          - _pf_auth_mount is match('^[A-Za-z0-9_-]+([./][A-Za-z0-9_-]+)*$')
          - _pf_external | bool or _pf_auth_mount == 'kubernetes'
        fail_msg: >-
          openbao_auth_mount ('{{ _pf_auth_mount }}') must be an auth mount path of
          [A-Za-z0-9_-] segments separated by a single / or . (no leading, trailing or doubled
          separator), and
          'kubernetes' in openbao_mode: internal (only external mode can use another mount,
          e.g. one per cluster sharing an OpenBao).
        quiet: true

    - name: "Preflight - Secrets backend: openbao external mode keys"
      when: _pf_external | bool
      vars:
        _pf_ext_addr: "{{ openbao_address | default('', true) | string | trim }}"
        # A relative path is relative to the directory ansible-playbook runs in.
        _pf_ext_ca: >-
          {{ (openbao_ca_file | string | trim | expanduser | realpath)
             if (openbao_ca_file | default('', true) | string | trim | length > 0) else '' }}
        _pf_ext_ca_pem: "{{ lookup('ansible.builtin.file', _pf_ext_ca) if (_pf_ext_ca | length > 0 and _pf_ext_ca is file) else '' }}"
        _pf_ext_cid: "{{ openbao_cluster_id | default('', true) | string | trim }}"
        _pf_ext_problems: >-
          {{ (['openbao_address is empty (the https:// URL of your OpenBao, e.g. https://openbao.example.com:8200)'] if _pf_ext_addr | length == 0 else [])
             + (['openbao_address (' ~ _pf_ext_addr ~ ') must be an https:// URL with only a host and an optional port (http:// is not allowed)']
                if _pf_ext_addr | length > 0 and _pf_ext_addr is not match('^https://([A-Za-z0-9.-]+|\[[0-9A-Fa-f:]+\])(:[0-9]{1,5})?/?$') else [])
             + (['openbao_ca_file is empty (a PEM file on the installer host with the CA that signed openbao_address)'] if _pf_ext_ca | length == 0 else [])
             + (['openbao_ca_file (' ~ _pf_ext_ca ~ ') does not exist on the installer host'] if _pf_ext_ca | length > 0 and _pf_ext_ca is not file else [])
             + (['openbao_ca_file (' ~ _pf_ext_ca ~ ') holds no PEM certificate'] if _pf_ext_ca is file and '-----BEGIN CERTIFICATE-----' not in _pf_ext_ca_pem else [])
             + (['openbao_ca_file (' ~ _pf_ext_ca ~ ') contains a private key; give the CA certificate only'] if _pf_ext_ca is file and 'PRIVATE KEY' in _pf_ext_ca_pem else [])
             + (['openbao_cluster_id is empty: external mode requires an explicit cluster id, unique per cluster sharing the OpenBao'] if _pf_ext_cid | length == 0 else [])
             + (['openbao_route_enabled is supported in internal mode only (your OpenBao publishes its own endpoint)']
                if openbao_route_enabled | default(false) | bool else []) }}
      ansible.builtin.assert:
        that:
          - _pf_ext_problems | length == 0
        fail_msg: "openbao_mode: external — {{ _pf_ext_problems | join('; ') }}."
        quiet: true

    - name: "Preflight - Secrets backend: openbao internal mode keys"
      when: not (_pf_external | bool)
      block:
        - name: "Preflight - Secrets backend: openbao_replicas is 1 or an odd number >= 3"
          ansible.builtin.assert:
            that:
              - (openbao_replicas | default(1) | string) is match('^[0-9]+$')
              - (openbao_replicas | default(1) | int) == 1 or
                ((openbao_replicas | default(1) | int) >= 3 and (openbao_replicas | default(1) | int) is odd)
            fail_msg: >-
              openbao_replicas must be 1 or an odd number >= 3 for a Raft quorum
              (got '{{ openbao_replicas | default('') }}').
            quiet: true

        - name: "Preflight - Secrets backend: openbao unseal shares and threshold"
          vars:
            _pf_shares: "{{ openbao_key_shares | default(5) }}"
            _pf_threshold: "{{ openbao_key_threshold | default(3) }}"
          ansible.builtin.assert:
            that:
              - (_pf_shares | string) is match('^[0-9]+$')
              - (_pf_threshold | string) is match('^[0-9]+$')
              - (_pf_shares | int) >= 1
              - (_pf_threshold | int) >= 1
              - (_pf_threshold | int) <= (_pf_shares | int)
              - (_pf_shares | int) <= 255
              - (_pf_shares | int) == 1 or (_pf_threshold | int) >= 2
            fail_msg: >-
              openbao_key_threshold ({{ _pf_threshold }}) must be between 1 and
              openbao_key_shares ({{ _pf_shares }}), and at least 2 when there is more
              than one share; openbao_key_shares must be 1..255.
            quiet: true

        - name: "Preflight - Secrets backend: openbao_init_timeout"
          vars:
            _pf_init_timeout: "{{ openbao_init_timeout | default(120) }}"
          ansible.builtin.assert:
            that:
              - (_pf_init_timeout | string) is match('^[0-9]+$')
              - (_pf_init_timeout | int) >= 2
            fail_msg: "openbao_init_timeout must be a number of seconds >= 2 (got '{{ _pf_init_timeout }}')."
            quiet: true

    - name: "Preflight - Secrets backend: openbao KV mount and cluster id are path-safe"
      ansible.builtin.assert:
        that:
          - _pf_kv is match('^[A-Za-z0-9._-]+$')
          - _pf_kv not in ['.', '..']
          # Reserved OpenBao paths: /v1/<mount> would become /v1/sys etc. (route allowlist).
          - (_pf_kv | lower) not in ['sys', 'auth', 'identity', 'cubbyhole', 'token']
          - (_pf_cid | string) is match('^[A-Za-z0-9._-]+$')
          - (_pf_cid | string) not in ['.', '..']
          # The ESO vault provider strips a leading '<mount>/' from every key.
          - (_pf_cid | string) != _pf_kv
        fail_msg: >-
          openbao_kv_mount ('{{ _pf_kv }}', not one of the reserved paths
          sys, auth, identity, cubbyhole, token) and the cluster id
          ('{{ _pf_cid }}', from openbao_cluster_id or the env name) must be non-empty names of
          [A-Za-z0-9._-] other than . and .., and different from each other.
        quiet: true

    - name: "Preflight - Secrets backend: openbao_layers"
      ansible.builtin.assert:
        that:
          - _pf_layers is sequence
          - _pf_layers is not string
          - _pf_layers is not mapping
          - _pf_layers | length > 0
          - _pf_layers | map('string') | select('match', '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') | list | length == (_pf_layers | length)
          - _pf_layers | map('string') | select('match', '^.{' ~ (_pf_layer_max | int + 1) ~ ',}$') | list | length == 0
          - _pf_layers | unique | length == (_pf_layers | length)
        fail_msg: >-
          openbao_layers ({{ _pf_layers }}) must be a non-empty list of distinct lower-kebab layer names
          of at most {{ _pf_layer_max }} characters.
        quiet: true

    - name: "Preflight - Secrets backend: openbao_auth_audience"
      ansible.builtin.assert:
        that:
          # Missing: the default 'vault'; null or empty fails.
          - openbao_auth_audience | default('vault') | default('', true) | string | trim | length > 0
        fail_msg: "openbao_auth_audience must not be empty (got '{{ openbao_auth_audience | default('', true) }}')."
        quiet: true

    # The erag secrets worker Jobs run as this ServiceAccount in this namespace
    # (bootstrap.sh / the external template bind the OpenBao erag role to them).
    - name: "Preflight - Secrets backend: erag secrets worker namespace and ServiceAccount"
      vars:
        _pf_ns: "{{ erag_secrets_namespace | default('erag-secrets') | string }}"
        _pf_sa: "{{ erag_secrets_worker_sa | default('erag-secrets-worker') | string }}"
      ansible.builtin.assert:
        that:
          - _pf_ns is match(_pf_label)
          - _pf_sa is match(_pf_subdomain)
          - _pf_sa | length <= 253
        fail_msg: >-
          erag_secrets_namespace ('{{ _pf_ns }}') must be a DNS-1123 label and
          erag_secrets_worker_sa ('{{ _pf_sa }}') a DNS-1123 subdomain.
        quiet: true
