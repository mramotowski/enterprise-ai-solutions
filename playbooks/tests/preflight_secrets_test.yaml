#
# Global preflight of the secrets settings — offline test (no cluster access).
#
# Runs playbooks/includes/preflight_secrets.yaml (included by
# includes/preflight.yaml on every site.yaml run) once per row: one row per
# rule on a user-facing openbao_* / erag_secrets_* key, plus rows that must
# pass (internal and external mode, a slash auth mount, and secrets_backend:
# local with invalid openbao keys, which are not checked then). The fake CA
# files go to a temp dir that is removed at the end.
#
# Run from the repo root:
#   ansible-playbook -i localhost, -c local playbooks/tests/preflight_secrets_test.yaml

- name: "preflight secrets | test"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _repo_dir: "{{ playbook_dir | dirname | dirname }}"
    _bad_everything:
      openbao_mode: bogus
      openbao_address: "http://x/y"
      openbao_kv_mount: sys
      openbao_cluster_id: "a/b"
      openbao_replicas: 2
      openbao_auth_mount: "k8s//a"
      openbao_layers: "erag"
      openbao_key_shares: 0
      openbao_init_timeout: 1
      erag_secrets_namespace: "Erag_Secrets"
    _cases:
      # ── Must pass ────────────────────────────────────────────────────────
      - {name: "internal defaults", vars: {}, expect: ""}
      - {name: "internal, 3 replicas", vars: {openbao_replicas: 3}, expect: ""}
      - {name: "internal, 5 replicas, 1 of 1 share", vars: {openbao_replicas: 5, openbao_key_shares: 1, openbao_key_threshold: 1}, expect: ""}
      - name: "external, slash auth mount k8s/cluster-a"
        vars: {openbao_mode: external, openbao_address: "https://openbao.example.com:8200/", openbao_auth_mount: "k8s/cluster-a", openbao_cluster_id: cluster-a}
        expect: ""
      - name: "external, IPv6 address"
        vars: {openbao_mode: external, openbao_address: "https://[fd00::1]:8200"}
        expect: ""
      - {name: "two layers, longest name", vars: {openbao_layers: ["erag", "{{ 'a' * 57 }}"]}, expect: ""}
      - {name: "explicit cluster id", vars: {openbao_cluster_id: "c-1.a"}, expect: ""}
      - {name: "secrets_backend local: openbao keys not checked", vars: "{{ _bad_everything | combine({'secrets_backend': 'local'}) }}", expect: ""}
      - {name: "secrets_backend empty means local", vars: "{{ _bad_everything | combine({'secrets_backend': ''}) }}", expect: ""}
      # ── openbao_mode ─────────────────────────────────────────────────────
      - {name: "unknown mode", vars: {openbao_mode: bogus}, expect: "openbao_mode must be 'internal' or 'external' \\(got 'bogus'\\)"}
      # ── openbao_auth_mount ───────────────────────────────────────────────
      - {name: "internal: auth mount other than kubernetes", vars: {openbao_auth_mount: "k8s-a"}, expect: "'kubernetes' in openbao_mode: internal"}
      - name: "external: doubled separator"
        vars: {openbao_mode: external, openbao_auth_mount: "k8s//a"}
        expect: "openbao_auth_mount \\('k8s//a'\\) must be an auth mount path"
      - name: "external: trailing separator"
        vars: {openbao_mode: external, openbao_auth_mount: "k8s/"}
        expect: "openbao_auth_mount \\('k8s/'\\) must be an auth mount path"
      # ── External mode ────────────────────────────────────────────────────
      - {name: "external: empty address", vars: {openbao_mode: external, openbao_address: ""}, expect: "openbao_address is empty"}
      - name: "external: http:// address"
        vars: {openbao_mode: external, openbao_address: "http://openbao.example.com:8200"}
        expect: "openbao_address \\(http://openbao.example.com:8200\\) must be an https:// URL"
      - name: "external: address with a path"
        vars: {openbao_mode: external, openbao_address: "https://openbao.example.com/v1"}
        expect: "must be an https:// URL with only a host"
      - {name: "external: empty CA file", vars: {openbao_mode: external, openbao_ca_file: ""}, expect: "openbao_ca_file is empty"}
      - name: "external: CA file absent"
        vars: {openbao_mode: external, openbao_ca_file: "/nonexistent/openbao-ca.pem"}
        expect: "openbao_ca_file \\(/nonexistent/openbao-ca.pem\\) does not exist on the installer host"
      - {name: "external: CA file without a certificate", vars: {openbao_mode: external, openbao_ca_file: "@tmp/not-a-cert.pem"}, expect: "holds no PEM certificate"}
      - {name: "external: CA file with a private key", vars: {openbao_mode: external, openbao_ca_file: "@tmp/with-key.pem"}, expect: "contains a private key"}
      - name: "external: empty cluster id"
        vars: {openbao_mode: external, openbao_cluster_id: ""}
        expect: "openbao_cluster_id is empty: external mode requires an explicit cluster id"
      - {name: "external: route enabled", vars: {openbao_mode: external, openbao_route_enabled: true}, expect: "openbao_route_enabled is supported in internal mode only"}
      - name: "external: every problem at once"
        vars: {openbao_mode: external, openbao_address: "", openbao_ca_file: "", openbao_cluster_id: ""}
        expect: "openbao_address is empty.*openbao_ca_file is empty.*openbao_cluster_id is empty"
      # ── Internal mode ────────────────────────────────────────────────────
      - {name: "bad replicas (2)", vars: {openbao_replicas: 2}, expect: "must be 1 or an odd number >= 3"}
      - {name: "bad replicas (4)", vars: {openbao_replicas: 4}, expect: "must be 1 or an odd number >= 3"}
      - {name: "bad replicas (0)", vars: {openbao_replicas: 0}, expect: "must be 1 or an odd number >= 3"}
      - {name: "bad replicas (three)", vars: {openbao_replicas: "three"}, expect: "must be 1 or an odd number >= 3"}
      - {name: "bad replicas (-1)", vars: {openbao_replicas: -1}, expect: "must be 1 or an odd number >= 3"}
      - name: "bad shares (threshold 4 > shares 3)"
        vars: {openbao_key_shares: 3, openbao_key_threshold: 4}
        expect: "openbao_key_threshold \\(4\\) must be between 1 and\\s+openbao_key_shares \\(3\\)"
      - {name: "bad shares (0)", vars: {openbao_key_shares: 0, openbao_key_threshold: 0}, expect: "openbao_key_threshold \\(0\\).*openbao_key_shares \\(0\\)"}
      - {name: "too many shares (256)", vars: {openbao_key_shares: 256, openbao_key_threshold: 3}, expect: "openbao_key_shares must be 1..255"}
      - {name: "threshold 1 of 5", vars: {openbao_key_shares: 5, openbao_key_threshold: 1}, expect: "at least 2 when there is more"}
      - {name: "init timeout 1", vars: {openbao_init_timeout: 1}, expect: "openbao_init_timeout must be a number of seconds >= 2"}
      # ── KV mount and cluster id ──────────────────────────────────────────
      - {name: "kv mount sys (reserved)", vars: {openbao_kv_mount: "sys"}, expect: "not one of the reserved paths"}
      - {name: "kv mount Auth (reserved, any case)", vars: {openbao_kv_mount: "Auth"}, expect: "not one of the reserved paths"}
      - {name: "kv mount .", vars: {openbao_kv_mount: "."}, expect: "openbao_kv_mount \\('.'"}
      - {name: "kv mount a/b", vars: {openbao_kv_mount: "a/b"}, expect: "openbao_kv_mount \\('a/b'"}
      - {name: "kv mount empty", vars: {openbao_kv_mount: ""}, expect: "openbao_kv_mount \\(''"}
      - {name: "kv mount null", vars: {openbao_kv_mount: null}, expect: "openbao_kv_mount \\(''"}
      - {name: "cluster id ..", vars: {openbao_cluster_id: ".."}, expect: "cluster id\\s+\\('..'"}
      - {name: "cluster id a/b", vars: {openbao_cluster_id: "a/b"}, expect: "cluster id\\s+\\('a/b'"}
      - {name: "cluster id with a space", vars: {openbao_cluster_id: "a b"}, expect: "cluster id\\s+\\('a b'"}
      - {name: "env name as cluster id, invalid", vars: {env_name: "my env"}, expect: "cluster id\\s+\\('my env'"}
      - {name: "cluster id equals the kv mount (ESO strips <mount>/ from keys)", vars: {openbao_cluster_id: "intel-ai"}, expect: "different from each other"}
      # ── openbao_layers ───────────────────────────────────────────────────
      - {name: "empty layers", vars: {openbao_layers: []}, expect: "openbao_layers \\(\\[\\]\\) must be a non-empty list"}
      - {name: "layers as a string", vars: {openbao_layers: "erag"}, expect: "must be a non-empty list"}
      - {name: "layers as a mapping", vars: {openbao_layers: {erag: true}}, expect: "must be a non-empty list"}
      - {name: "layer with upper case and _", vars: {openbao_layers: ["Erag_1"]}, expect: "lower-kebab"}
      - {name: "layer ending in -", vars: {openbao_layers: ["erag-"]}, expect: "lower-kebab"}
      - {name: "duplicate layers", vars: {openbao_layers: [erag, erag]}, expect: "distinct"}
      - {name: "layer too long for the annotation key", vars: {openbao_layers: ["{{ 'a' * 58 }}"]}, expect: "at most 57 characters"}
      # ── openbao_auth_audience ────────────────────────────────────────────
      - {name: "empty audience", vars: {openbao_auth_audience: ""}, expect: "openbao_auth_audience must not be empty"}
      - {name: "null audience", vars: {openbao_auth_audience: null}, expect: "openbao_auth_audience must not be empty"}
      # ── erag secrets worker ──────────────────────────────────────────────
      - {name: "bad worker namespace", vars: {erag_secrets_namespace: "Erag_Secrets"}, expect: "erag_secrets_namespace \\('Erag_Secrets'\\) must be a DNS-1123 label"}
      - {name: "worker namespace too long", vars: {erag_secrets_namespace: "{{ 'a' * 64 }}"}, expect: "erag_secrets_namespace .* must be a DNS-1123 label"}
      - {name: "bad worker SA", vars: {erag_secrets_worker_sa: "-sa"}, expect: "erag_secrets_worker_sa \\('-sa'\\) a DNS-1123 subdomain"}
      - {name: "worker SA with ..", vars: {erag_secrets_worker_sa: "a..b"}, expect: "erag_secrets_worker_sa \\('a..b'\\) a DNS-1123 subdomain"}
      - {name: "worker SA too long", vars: {erag_secrets_worker_sa: "{{ 'a' * 254 }}"}, expect: "erag_secrets_worker_sa .* a DNS-1123 subdomain"}
  tasks:
    - name: "preflight secrets | test | Create a temp dir"
      ansible.builtin.tempfile:
        state: directory
        prefix: preflight-secrets-
      register: _tmp

    - name: "preflight secrets | test | Run"
      block:
        # Preflight only looks at the text of openbao_ca_file.
        - name: "preflight secrets | test | Fake CA files"
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/{{ item.f }}"
            content: "{{ item.c }}"
            mode: "0600"
          loop:
            - {f: ca.pem, c: "-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----\n"}
            - {f: not-a-cert.pem, c: "hello\n"}
            - {f: with-key.pem, c: "-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----\n-----BEGIN PRIVATE KEY-----\nMIIB\n-----END PRIVATE KEY-----\n"}
          loop_control:
            label: "{{ item.f }}"

        # The wiring: includes/preflight.yaml runs this file for openbao, except on teardown.
        - name: "preflight secrets | test | includes/preflight.yaml includes preflight_secrets.yaml"
          vars:
            _incl: >-
              {%- set r = [] -%}
              {%- for t in lookup('ansible.builtin.file', _repo_dir ~ '/playbooks/includes/preflight.yaml') | from_yaml
                    if t['ansible.builtin.include_tasks'] | default('') == 'preflight_secrets.yaml' -%}
                {%- set _ = r.append(t) -%}
              {%- endfor -%}
              {{ r }}
          ansible.builtin.assert:
            that:
              - _incl | length == 1
              - _incl[0].when == ["(secrets_backend | default('local', true)) == 'openbao'", "(component_action | default('install')) != 'teardown'"]
            fail_msg: "{{ _incl | to_json }}"
            quiet: true

        # The default()s in preflight_secrets.yaml copy role and global_config
        # defaults (role defaults are not loaded yet): they must not drift.
        - name: "preflight secrets | test | Load the openbao role defaults"
          ansible.builtin.include_vars:
            file: "{{ _repo_dir }}/roles/openbao/defaults/main.yaml"
            name: _ob_defaults

        - name: "preflight secrets | test | Load the external_secrets role defaults"
          ansible.builtin.include_vars:
            file: "{{ _repo_dir }}/roles/external_secrets/defaults/main.yaml"
            name: _eso_defaults

        - name: "preflight secrets | test | Load global_config.yaml"
          ansible.builtin.include_vars:
            file: "{{ _repo_dir }}/configs/defaults/global_config.yaml"
            name: _global_defaults

        - name: "preflight secrets | test | Preflight fallbacks equal the defaults"
          vars:
            _text: "{{ lookup('ansible.builtin.file', _repo_dir ~ '/playbooks/includes/preflight_secrets.yaml') }}"
            _want:
              openbao_key_shares: "{{ _ob_defaults.openbao_key_shares }}"
              openbao_key_threshold: "{{ _ob_defaults.openbao_key_threshold }}"
              openbao_init_timeout: "{{ _ob_defaults.openbao_init_timeout }}"
              external_secrets_paths_annotation_suffix: "{{ _eso_defaults.external_secrets_paths_annotation_suffix }}"
              openbao_mode: "{{ _global_defaults.openbao_mode }}"
              openbao_replicas: "{{ _global_defaults.openbao_replicas }}"
              openbao_auth_audience: "{{ _global_defaults.openbao_auth_audience }}"
              openbao_auth_mount: "{{ _global_defaults.openbao_auth_mount }}"
              erag_secrets_namespace: "{{ _global_defaults.erag_secrets_namespace }}"
              erag_secrets_worker_sa: "{{ _global_defaults.erag_secrets_worker_sa }}"
            # "<key> | default(<value>" as the file writes it (ints bare, strings quoted).
            _expected: >-
              {{ _want | dict2items | map(attribute='key')
                 | zip(_want | dict2items | map(attribute='value') | map('string')
                       | map('regex_replace', '^(.*[^0-9].*|)$', "'\1'"))
                 | map('join', ' | default(') | list }}
          ansible.builtin.assert:
            that:
              - _expected | reject('in', _text) | list | length == 0
            fail_msg: "not in preflight_secrets.yaml: {{ _expected | reject('in', _text) | list | to_json }}"
            quiet: true

        - name: "preflight secrets | test | Run the cases"
          ansible.builtin.include_tasks: _preflight_secrets_case.yaml
          loop: "{{ _cases }}"
          loop_control:
            loop_var: _case
            label: "{{ _case.name }}"

        - name: "preflight secrets | test | All asserts passed"
          ansible.builtin.debug:
            msg: "{{ _cases | length }} preflight cases passed."
      always:
        - name: "preflight secrets | test | Remove temp dir"
          ansible.builtin.file:
            path: "{{ _tmp.path }}"
            state: absent
