#
# One row of preflight_secrets_test.yaml (_case: {name, vars, expect}):
# includes/preflight_secrets.yaml with the row's vars over a valid internal
# config; expect is the regex of the failure, '' = must pass.

- name: "preflight secrets | test | {{ _case.name }} | Reset result"
  ansible.builtin.set_fact:
    _pf_msg: ""
    _pf_failed: false

- name: "preflight secrets | test | {{ _case.name }} | Run the preflight"
  block:
    - name: "preflight secrets | test | {{ _case.name }} | Include preflight_secrets.yaml"
      ansible.builtin.include_tasks: ../includes/preflight_secrets.yaml
      vars:
        secrets_backend: "{{ _case.vars.secrets_backend | default('openbao') }}"
        env_name: "{{ _case.vars.env_name | default('test') }}"
        openbao_mode: "{{ _case.vars.openbao_mode | default('internal') }}"
        openbao_address: "{{ _case.vars.openbao_address | default('https://openbao.example.com:8200') }}"
        # '@tmp/' = the test's temp dir (fake PEM files written there).
        openbao_ca_file: "{{ _case.vars.openbao_ca_file | default('@tmp/ca.pem') | regex_replace('^@tmp/', _tmp.path ~ '/') }}"
        openbao_kv_mount: "{{ _case.vars.openbao_kv_mount | default('intel-ai') }}"
        openbao_cluster_id: "{{ _case.vars.openbao_cluster_id | default('cluster-a' if _case.vars.openbao_mode | default('internal') == 'external' else '') }}"
        openbao_replicas: "{{ _case.vars.openbao_replicas | default(1) }}"
        openbao_auth_audience: "{{ _case.vars.openbao_auth_audience | default('vault') }}"
        openbao_auth_mount: "{{ _case.vars.openbao_auth_mount | default('kubernetes') }}"
        openbao_layers: "{{ _case.vars.openbao_layers | default(['erag']) }}"
        openbao_route_enabled: "{{ _case.vars.openbao_route_enabled | default(false) }}"
        openbao_key_shares: "{{ _case.vars.openbao_key_shares | default(5) }}"
        openbao_key_threshold: "{{ _case.vars.openbao_key_threshold | default(3) }}"
        openbao_init_timeout: "{{ _case.vars.openbao_init_timeout | default(120) }}"
        erag_secrets_namespace: "{{ _case.vars.erag_secrets_namespace | default('erag-secrets') }}"
        erag_secrets_worker_sa: "{{ _case.vars.erag_secrets_worker_sa | default('erag-secrets-worker') }}"
  rescue:
    - name: "preflight secrets | test | {{ _case.name }} | Record failure"
      ansible.builtin.set_fact:
        _pf_failed: true
        _pf_msg: "{{ ansible_failed_result.msg | default('') }}"

- name: "preflight secrets | test | {{ _case.name }} | Assert the outcome"
  ansible.builtin.assert:
    that:
      - (not _pf_failed) if _case.expect | length == 0 else (_pf_failed and _pf_msg is search(_case.expect))
    fail_msg: "Expected {{ ('/' ~ _case.expect ~ '/') if _case.expect else 'a pass' }}, got failed={{ _pf_failed }}: {{ _pf_msg }}"
    quiet: true
