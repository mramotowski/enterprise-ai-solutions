# openbao — the one openbao_mode check: the global preflight
# (playbooks/includes/preflight_secrets.yaml), teardown and upgrade.

- name: "openbao | Preflight — openbao_mode is internal or external"
  ansible.builtin.assert:
    that:
      - (openbao_mode | default('internal')) in ['internal', 'external']
    fail_msg: >-
      openbao_mode must be 'internal' or 'external' (got '{{ openbao_mode | default('') }}').
    quiet: true
