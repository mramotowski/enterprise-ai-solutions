# openbao — Preflight
#
# Included at the top of install.yaml and validate.yaml (and by
# tests/render_test.yaml). Nothing here touches the cluster or OpenBao: it
# resolves the facts the install, the checks and the chart values need, and
# checks that cert-manager is on in internal mode. The user-facing openbao_*
# keys are validated once, before any role, by the global preflight
# (playbooks/includes/preflight_secrets.yaml).

- name: "openbao | Preflight — Mode"
  ansible.builtin.set_fact:
    _openbao_external: "{{ (openbao_mode | default('internal')) == 'external' }}"
    _openbao_auth_mount: "{{ openbao_auth_mount | default('kubernetes', true) | string }}"
    # External mode: openbao_ca_file resolved once to an absolute path (a relative
    # path is relative to the directory ansible-playbook runs in); every check,
    # read and uri ca_path uses only this fact.
    _openbao_ca_file: >-
      {{ (openbao_ca_file | string | trim | expanduser | realpath)
         if (openbao_mode | default('internal')) == 'external' and (openbao_ca_file | default('', true) | string | trim | length > 0)
         else '' }}

# ── Internal mode ─────────────────────────────────────────────────────────────

- name: "openbao | Preflight — cert-manager is enabled (internal mode)"
  when: not (_openbao_external | bool)
  ansible.builtin.assert:
    that:
      - cert_manager_enabled | default(true) | bool
    fail_msg: >-
      openbao_mode: internal takes its listener TLS from cert-manager, but
      cert_manager_enabled is false. Set cert_manager_enabled: true or use
      secrets_backend: local.
    quiet: true

# ESO lives in its own role; read its namespace default without letting
# include_vars precedence override an operator's value.
- name: "openbao | Preflight — Load external_secrets defaults"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../external_secrets/defaults/main.yaml"
    name: _openbao_eso_defaults

- name: "openbao | Preflight — Resolve names"
  ansible.builtin.set_fact:
    _openbao_eso_namespace: "{{ external_secrets_namespace | default(_openbao_eso_defaults.external_secrets_namespace) }}"
    # The ESO chart names its controller SA after the release.
    _openbao_eso_sa: >-
      {{ external_secrets_service_account_name
         | default(external_secrets_helm_release_name | default(_openbao_eso_defaults.external_secrets_helm_release_name)) }}
    _openbao_cluster_id: "{{ openbao_cluster_id | default('', true) or env_name }}"
    # bootstrap.sh args: <layer>:<worker namespace>:<worker SA>; erag reads
    # erag_secrets_namespace / erag_secrets_worker_sa (global_config.yaml).
    _openbao_layer_specs: >-
      {% set r = [] %}{% for l in openbao_layers %}{% set _ = r.append(l ~ ':'
      ~ lookup('ansible.builtin.vars', l ~ '_secrets_namespace', default=l ~ '-secrets') ~ ':'
      ~ lookup('ansible.builtin.vars', l ~ '_secrets_worker_sa', default=l ~ '-secrets-worker')) %}{% endfor %}{{ r }}
    # External mode: the operator's OpenBao, as given (no trailing /) (the CA file is resolved in "Mode").
    _openbao_address: "{{ (openbao_address | default('', true) | string | trim | regex_replace('/+$', '')) if _openbao_external | bool else '' }}"

- name: "openbao | Preflight — Resolve peers and server cert names (internal mode)"
  when: not (_openbao_external | bool)
  vars:
    _fn: "{{ openbao_fullname }}"
    _ns: "{{ openbao_namespace }}"
    _cd: "{{ openbao_cluster_domain }}"
    _svc_names: "{{ [_fn, _fn ~ '-internal', _fn ~ '-active', _fn ~ '-standby'] }}"
    _pod_names: "{{ range(openbao_replicas | int) | map('regex_replace', '^(.*)$', _fn ~ '-\\1.' ~ _fn ~ '-internal') | list }}"
    _short: "{{ _svc_names + _pod_names }}"
  ansible.builtin.set_fact:
    # API addresses of pods 1..N-1 as seen from pod 0 (server cert SANs).
    _openbao_peer_addrs: >-
      {% set r = [] %}{% for i in range(1, openbao_replicas | int) %}{% set _ = r.append('https://'
      ~ _fn ~ '-' ~ i ~ '.' ~ _fn ~ '-internal:8200') %}{% endfor %}{{ r }}
    _openbao_server_dns_names: >-
      {{ _short
         + (_short | map('regex_replace', '$', '.' ~ _ns) | list)
         + (_short | map('regex_replace', '$', '.' ~ _ns ~ '.svc') | list)
         + (_short | map('regex_replace', '$', '.' ~ _ns ~ '.svc.' ~ _cd) | list) }}
    _openbao_server_ip_addresses: ["127.0.0.1"]
