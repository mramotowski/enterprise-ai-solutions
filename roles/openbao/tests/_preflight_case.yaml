# One preflight failure case of render_test.yaml (_case: {name, vars, expect}).

- name: "openbao | test | {{ _case.name }} | Reset result"
  ansible.builtin.set_fact:
    _pf_msg: ""
    _pf_failed: false

- name: "openbao | test | {{ _case.name }} | Run preflight"
  block:
    - name: "openbao | test | {{ _case.name }} | Include preflight"
      ansible.builtin.include_role:
        name: "{{ _role_dir }}"
        tasks_from: preflight.yaml
      vars:
        openbao_replicas: "{{ _case.vars.openbao_replicas | default(1) }}"
        openbao_mode: "{{ _case.vars.openbao_mode | default('internal') }}"
        cert_manager_enabled: "{{ _case.vars.cert_manager_enabled | default(true) }}"
  rescue:
    - name: "openbao | test | {{ _case.name }} | Record failure"
      ansible.builtin.set_fact:
        _pf_failed: true
        _pf_msg: "{{ ansible_failed_result.msg | default('') }}"

- name: "openbao | test | {{ _case.name }} | Assert preflight failed clearly"
  ansible.builtin.assert:
    that:
      - _pf_failed
      - _pf_msg is search(_case.expect)
    fail_msg: "Expected preflight to fail with /{{ _case.expect }}/, got failed={{ _pf_failed }}: {{ _pf_msg }}"
    quiet: true
