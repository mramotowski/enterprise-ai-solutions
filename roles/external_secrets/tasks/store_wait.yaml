#
# external_secrets — wait until every openbao-<layer> ClusterSecretStore is
# Ready with reason Valid (ESO logged in to OpenBao as eso-<layer> and looked
# up its token). Used by install and validate; _eso_store_wait_retries = 0
# checks once.

- name: "external_secrets | Read ClusterSecretStore status"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ClusterSecretStore
    name: "{{ item.name }}"
  register: _eso_store_status
  vars:
    _ready: >-
      {{ ((_eso_store_status.resources | default([{}]) | first).status | default({})).conditions | default([])
         | selectattr('type', 'eq', 'Ready') | list }}
  until:
    - _ready | selectattr('status', 'eq', 'True') | selectattr('reason', 'eq', 'Valid') | list | length > 0
  retries: "{{ _eso_store_wait_retries | default(external_secrets_store_wait_retries) }}"
  delay: "{{ external_secrets_store_wait_delay }}"
  failed_when: false
  loop: "{{ _eso_stores }}"
  loop_control:
    label: "{{ item.name }}"

- name: "external_secrets | Report the ClusterSecretStore status"
  ansible.builtin.include_tasks: store_assert.yaml
